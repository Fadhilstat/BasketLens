name: Python core tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q src app
      - run: python -m pytest -q
      - run: python scripts/check_public_demo.py
      - run: python -m pip check
      # GitLab shared CI quota can block MR Chromium jobs before execution.
      # Reuse the Python test environment to preserve an independent browser gate.
      - name: Install Chromium smoke dependencies (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium --with-deps
      - name: Public Chromium regression and research workbench (pull requests)
        if: github.event_name == 'pull_request'
        run: |
          python -m unittest discover -s site/tests -p provenance_guard_test.py
          python scripts/browser_smoke.py --data data/processed --report reports/quick-public
          python site/tests/browser_smoke.py
          python site/tests/explorer_browser_smoke.py
          python site/tests/basket_browser_smoke.py

  portfolio-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix site test
      - run: npm --prefix site run build
