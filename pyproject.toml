[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basketlens"
version = "0.1.0"
description = "Retail Market Basket and Cross-Selling Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Portfolio project"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "openpyxl>=3.1,<4",
    "mlxtend>=0.23,<1",
    "streamlit>=1.41,<2",
    "plotly>=5.22,<7",
    "networkx>=3.2,<4",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
basketlens = "basketlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
