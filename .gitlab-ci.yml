image: python:3.11-slim

stages:
  - test
  - verify

unit_tests:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
  script:
    - python -m compileall -q src app scripts
    - python -m pytest -q
    - python -m pip check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

public_ui_smoke:
  stage: verify
  needs: [unit_tests]
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pip install 'playwright>=1.50,<2'
    - python -m playwright install chromium --with-deps
  script:
    - python scripts/check_public_demo.py
    - python scripts/browser_smoke.py --data data/processed --report reports/quick-public
    - python site/tests/browser_smoke.py
    - python site/tests/explorer_browser_smoke.py
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/quick-public/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

real_dataset_audit:
  stage: verify
  needs: [unit_tests]
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -e ".[dev]"
    - python -m pip install 'playwright>=1.50,<2'
    - python -m playwright install chromium --with-deps
  script:
    - python -m basketlens.cli download
    - python scripts/source_conflict_audit.py --max-loss-fraction 0.01 --report reports
    - python -m basketlens.cli build --algorithm pairwise --inconsistent-policy quarantine --output .audit/pairwise
    - python -m basketlens.cli verify --output .audit/pairwise
    - python -m basketlens.cli build --algorithm fpgrowth --inconsistent-policy quarantine --output .audit/fpgrowth
    - python -m basketlens.cli verify --output .audit/fpgrowth
    - python scripts/verify_real_dataset.py --pairwise .audit/pairwise --fpgrowth .audit/fpgrowth --report reports
    - python scripts/browser_smoke.py --data .audit/fpgrowth --report reports/screenshots
    - python scripts/build_public_demo.py --input .audit/fpgrowth --output .audit/public_demo
    - python scripts/verify_public_parity.py --published data/public_demo/basketlens_public_v1.b64 --generated .audit/public_demo/basketlens_public_v1.b64
    - python scripts/browser_smoke.py --data data/processed --report reports/screenshots-public
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/source_conflict_audit.json
      - reports/real_dataset_audit.json
      - reports/screenshots/
      - reports/screenshots-public/
      - data/public_demo/basketlens_public_v1.b64
      - data/public_demo/basketlens_public_v1.b64.sha256
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'


portfolio_site_tests:
  image: node:22-bookworm-slim
  stage: test
  script:
    - npm --prefix site test
    - npm --prefix site run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'


hosted_portfolio_smoke:
  image: python:3.11-slim
  stage: verify
  needs: [portfolio_site_tests]
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install 'playwright>=1.50,<2'
    - python -m playwright install chromium --with-deps
  script:
    - python site/tests/hosted_smoke.py --url https://basketlens-fadhil-9768s-projects.vercel.app/ --report reports/vercel-guest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/vercel-guest/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

streamlit_guest_probe:
  image: python:3.11-slim
  stage: verify
  needs: [unit_tests]
  allow_failure: true
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install 'playwright>=1.50,<2'
    - python -m playwright install chromium --with-deps
  script:
    - python scripts/hosted_smoke.py --url https://basketlens-retail.streamlit.app/ --report reports/streamlit-guest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/streamlit-guest/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
